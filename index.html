<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HeadLock C28H</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial,sans-serif;
}

body{
    background:#000;
    color:#fff;
    min-height:100vh;
}

.container{
    width:100%;
    max-width:500px;
    margin:auto;
    padding:20px 15px 40px;
}

/* ================= KEY ================= */

#keyPage{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
}

.key-card{
    width:100%;
    border:1px solid #444;
    border-radius:18px;
    padding:25px;
    background:#080808;
    box-shadow:0 0 25px rgba(255,255,255,.08);
}

.logo{
    text-align:center;
    font-size:30px;
    font-weight:bold;
    margin-bottom:5px;
}

.sub-logo{
    text-align:center;
    color:#999;
    margin-bottom:25px;
}

.key-tabs{
    display:flex;
    gap:8px;
    margin-bottom:15px;
}

.key-tab{
    flex:1;
    padding:12px;
    border:1px solid #444;
    border-radius:10px;
    background:#111;
    color:#aaa;
    cursor:pointer;
}

.key-tab.active{
    background:#fff;
    color:#000;
}

input{
    width:100%;
    padding:14px;
    border-radius:10px;
    border:1px solid #444;
    background:#111;
    color:#fff;
    outline:none;
    margin-bottom:12px;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#fff;
    color:#000;
    font-weight:bold;
    cursor:pointer;
}

#error{
    text-align:center;
    color:#ff4d4d;
    margin-top:12px;
    min-height:20px;
}

/* ================= MAIN ================= */

#mainPage{
    display:none;
}

.header{
    text-align:center;
    padding:20px 0;
}

.header h1{
    font-size:30px;
}

.header p{
    color:#888;
    margin-top:5px;
}

.key-info{
    border:1px solid #333;
    border-radius:12px;
    padding:14px;
    margin-bottom:20px;
    background:#080808;
}

.key-info div{
    margin:5px 0;
}

.key-type{
    font-weight:bold;
}

.normal-text{
    color:#fff;
}

.premium-text{
    color:#fff;
}

/* ================= GAME ================= */

#gamePage{
    display:none;
}

.game-title{
    text-align:center;
    margin-bottom:15px;
}

.game-title h2{
    font-size:23px;
}

.game-title p{
    color:#888;
    margin-top:5px;
}

.game-buttons{
    display:flex;
    gap:10px;
    margin-bottom:20px;
}

.game-btn{
    flex:1;
    padding:16px 8px;
    border:1px solid #444;
    border-radius:12px;
    background:#0b0b0b;
    color:#fff;
    cursor:pointer;
}

.game-btn:hover{
    background:#fff;
    color:#000;
}

#functionPage{
    display:none;
}

/* ================= FUNCTION ================= */

.section-title{
    font-size:18px;
    font-weight:bold;
    margin:20px 0 10px;
}

.function-box{
    position:relative;
    border:1px solid #333;
    border-radius:12px;
    padding:17px;
    margin-bottom:10px;
    background:#080808;
}

.function-box .brand{
    position:absolute;
    top:7px;
    right:10px;
    font-size:8px;
    color:#555;
}

.function-name{
    font-size:15px;
    padding-right:35px;
}

.switch{
    position:absolute;
    right:15px;
    top:50%;
    transform:translateY(-50%);
    width:42px;
    height:22px;
    background:#333;
    border-radius:20px;
    cursor:pointer;
}

.switch::after{
    content:"";
    position:absolute;
    width:18px;
    height:18px;
    top:2px;
    left:2px;
    background:#aaa;
    border-radius:50%;
    transition:.2s;
}

.switch.on{
    background:#fff;
}

.switch.on::after{
    left:22px;
    background:#000;
}

/* ================= DPI ================= */

.dpi-box{
    border:1px solid #333;
    border-radius:12px;
    padding:17px;
    margin-top:10px;
    background:#080808;
}

.dpi-box .brand{
    float:right;
    font-size:8px;
    color:#555;
}

.dpi-input{
    margin-top:12px;
    margin-bottom:0;
}

/* ================= SENS ================= */

.sensitivity{
    margin-top:20px;
    border:1px solid #333;
    border-radius:12px;
    padding:17px;
    background:#080808;
}

.device-input{
    margin-top:12px;
}

.sens-result{
    display:none;
    margin-top:15px;
}

.sens-row{
    border:1px solid #292929;
    border-radius:8px;
    padding:11px;
    margin-top:7px;
    display:flex;
    justify-content:space-between;
}

.sens-value{
    font-weight:bold;
}

/* ================= TÂM ẢO ================= */

#crosshair{
    display:none;
    position:fixed;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    width:30px;
    height:30px;
    pointer-events:none;
    z-index:9999;
}

#crosshair::before,
#crosshair::after{
    content:"";
    position:absolute;
    background:#fff;
}

#crosshair::before{
    width:30px;
    height:2px;
    top:14px;
    left:0;
}

#crosshair::after{
    width:2px;
    height:30px;
    left:14px;
    top:0;
}

.back{
    margin-top:20px;
    background:#111;
    color:#fff;
    border:1px solid #333;
}
</style>
</head>

<body>

<div class="container">

<!-- ================= KEY PAGE ================= -->

<div id="keyPage">

<div class="key-card">

<div class="logo">C28H</div>
<div class="sub-logo">HeadLock C28H</div>

<div class="key-tabs">
<button class="key-tab active" onclick="selectKeyType('normal',this)">
Key Normal
</button>

<button class="key-tab" onclick="selectKeyType('premium',this)">
Key Premium
</button>
</div>

<input
id="keyInput"
placeholder="Nhập key của bạn..."
autocomplete="off"
>

<button onclick="checkKey()">XÁC NHẬN KEY</button>

<div id="error"></div>

</div>
</div>


<!-- ================= MAIN PAGE ================= -->

<div id="mainPage">

<div class="header">
<h1>HeadLock C28H</h1>
<p>C28H Aim</p>
</div>

<div class="key-info">

<div>
Loại Key:
<span id="keyType" class="key-type"></span>
</div>

<div>
Thời hạn:
<span id="keyDuration"></span>
</div>

<div>
Hết hạn vào:
<span id="expireTime"></span>
</div>

</div>


<!-- ================= GAME SELECT ================= -->

<div id="gamePage">

<div class="game-title">
<h2>CHỌN GAME</h2>
<p>Chọn phiên bản Free Fire</p>
</div>

<div class="game-buttons">

<button
class="game-btn"
onclick="openGame('Free Fire Thường')">
FREE FIRE<br>THƯỜNG
</button>

<button
class="game-btn"
onclick="openGame('Free Fire MAX')">
FREE FIRE<br>MAX
</button>

</div>

</div>


<!-- ================= FUNCTIONS ================= -->

<div id="functionPage">

<div class="game-title">
<h2 id="selectedGame"></h2>
<p id="functionType"></p>
</div>

<div class="section-title">
CHỨC NĂNG
</div>

<div id="functions"></div>

<!-- DPI RIÊNG -->

<div class="dpi-box">

<span class="brand">C28H</span>

<div class="function-name">
DPI
</div>

<input
class="dpi-input"
id="dpi"
type="number"
min="1"
max="120"
placeholder="Nhập DPI 1 - 120"
>

</div>


<!-- SENSITIVITY -->

<div class="sensitivity">

<div class="section-title" style="margin-top:0">
ĐỘ NHẠY
</div>

<input
class="device-input"
id="device"
placeholder="Nhập tên thiết bị..."
>

<button onclick="getSensitivity()">
LẤY ĐỘ NHẠY
</button>

<div class="sens-result" id="sensResult">

<div class="sens-row">
<span>Nhìn xung quanh</span>
<span class="sens-value" id="s1"></span>
</div>

<div class="sens-row">
<span>Ống ngắm hồng tâm</span>
<span class="sens-value" id="s2"></span>
</div>

<div class="sens-row">
<span>Ống ngắm 2X</span>
<span class="sens-value" id="s3"></span>
</div>

<div class="sens-row">
<span>Ống ngắm 4X</span>
<span class="sens-value" id="s4"></span>
</div>

<div class="sens-row">
<span>Ống ngắm súng ngắm</span>
<span class="sens-value" id="s5"></span>
</div>

<div class="sens-row">
<span>Nút camera tự do</span>
<span class="sens-value" id="s6"></span>
</div>

<div class="sens-row">
<span>Nút bắn chuẩn</span>
<span class="sens-value" id="fire"></span>
</div>

</div>

</div>


<button class="back" onclick="backToGame()">
← QUAY LẠI CHỌN GAME
</button>

</div>

</div>

</div>


<!-- TÂM ẢO - CHỈ HIỂN THỊ KHI PREMIUM -->

<div id="crosshair"></div>


<script>

/* ================= DATA ================= */

let selectedKeyType = "normal";
let currentKey = "";
let expireAt = null;
let timer;


/* ================= KEY TYPE ================= */

function selectKeyType(type,button){

    selectedKeyType = type;

    document
    .querySelectorAll(".key-tab")
    .forEach(x => x.classList.remove("active"));

    button.classList.add("active");

}


/* ================= KEY CHECK ================= */

function checkKey(){

    const key =
    document
    .getElementById("keyInput")
    .value
    .trim();

    const normalRegex =
    /^c28hios-(gio|ngay|tuan|thang|vv)-[A-Za-z0-9]{5}$/;

    const premiumRegex =
    /^c28hpre-(gio|ngay|tuan|thang|vv)-[A-Za-z0-9]{5}$/;


    let type = null;

    if(normalRegex.test(key)){
        type = "normal";
    }

    if(premiumRegex.test(key)){
        type = "premium";
    }


    if(!type){

        document
        .getElementById("error")
        .textContent = "Key không hợp lệ!";

        return;
    }


    currentKey = key;
    selectedKeyType = type;


    const duration =
    key.split("-")[1];


    let durationText = "";
    let milliseconds = 0;


    if(duration === "gio"){
        durationText = "1 giờ";
        milliseconds = 60 * 60 * 1000;
    }

    else if(duration === "ngay"){
        durationText = "1 ngày";
        milliseconds = 24 * 60 * 60 * 1000;
    }

    else if(duration === "tuan"){
        durationText = "1 tuần";
        milliseconds = 7 * 24 * 60 * 60 * 1000;
    }

    else if(duration === "thang"){
        durationText = "1 tháng";
        milliseconds = 30 * 24 * 60 * 60 * 1000;
    }

    else if(duration === "vv"){
        durationText = "Vĩnh viễn";
        milliseconds = null;
    }


    if(milliseconds){
        expireAt = Date.now() + milliseconds;
    }


    document
    .getElementById("keyPage")
    .style.display = "none";

    document
    .getElementById("mainPage")
    .style.display = "block";

    document
    .getElementById("gamePage")
    .style.display = "block";

    document
    .getElementById("functionPage")
    .style.display = "none";


    document
    .getElementById("keyType")
    .textContent =
    type === "normal"
    ? "NORMAL"
    : "PREMIUM";


    document
    .getElementById("keyDuration")
    .textContent = durationText;


    if(expireAt){

        document
        .getElementById("expireTime")
        .textContent =
        new Date(expireAt)
        .toLocaleString("vi-VN");

        startTimer();

    }else{

        document
        .getElementById("expireTime")
        .textContent = "Vĩnh viễn";

    }

}


/* ================= TIMER ================= */

function startTimer(){

    clearInterval(timer);

    timer = setInterval(() => {

        if(!expireAt) return;

        if(Date.now() >= expireAt){

            clearInterval(timer);

            alert("Key đã hết hạn!");

            location.reload();

        }

    },1000);

}


/* ================= GAME ================= */

function openGame(game){

    document
    .getElementById("gamePage")
    .style.display = "none";

    document
    .getElementById("functionPage")
    .style.display = "block";


    document
    .getElementById("selectedGame")
    .textContent = game;


    renderFunctions();

}


/* ================= FUNCTIONS ================= */

function renderFunctions(){

    const box =
    document.getElementById("functions");

    box.innerHTML = "";


    let functions = [];


    /*
      NORMAL:
      Không có Tâm Ảo
      Không có HeadLock
      Không có Bám đầu
      Không có Nhạy Màn
    */

    if(selectedKeyType === "normal"){

        functions = [
            "Aimlock V1",
            "Nhẹ Tâm",
            "Fix Rung",
            "Fix Lố"
        ];

    }


    /*
      PREMIUM:
      Có đầy đủ chức năng premium
    */

    else{

        functions = [
            "Tâm Ảo",
            "Aimlock VIP",
            "HeadLock",
            "Nhẹ Tâm",
            "Bám đầu",
            "Fix Rung",
            "Fix Lố",
            "Nhạy Màn",
            "Buff FPS"
        ];

    }


    document
    .getElementById("functionType")
    .textContent =
    selectedKeyType === "normal"
    ? "CHỨC NĂNG NORMAL"
    : "CHỨC NĂNG PREMIUM";


    functions.forEach(name => {

        const div =
        document.createElement("div");

        div.className = "function-box";

        div.innerHTML = `
            <span class="brand">C28H</span>

            <div class="function-name">
                ${name}
            </div>

            <div
                class="switch"
                onclick="toggleFunction(this,'${name}')">
            </div>
        `;

        box.appendChild(div);

    });

}


/* ================= SWITCH ================= */

function toggleFunction(el,name){

    el.classList.toggle("on");

    const enabled =
    el.classList.contains("on");


    /*
      Tâm Ảo chỉ là giao diện crosshair
      trên trang web, không can thiệp game.
    */

    if(name === "Tâm Ảo"){

        document
        .getElementById("crosshair")
        .style.display =
        enabled ? "block" : "none";

    }

}


/* ================= SENSITIVITY ================= */

function getSensitivity(){

    const device =
    document
    .getElementById("device")
    .value
    .trim();


    if(!device){

        alert("Hãy nhập tên thiết bị!");

        return;
    }


    /*
      Demo giao diện.
      Không can thiệp hoặc thay đổi game.
    */

    document.getElementById("s1").textContent = "180";
    document.getElementById("s2").textContent = "175";
    document.getElementById("s3").textContent = "170";
    document.getElementById("s4").textContent = "165";
    document.getElementById("s5").textContent = "160";
    document.getElementById("s6").textContent = "190";
    document.getElementById("fire").textContent = "55";


    document
    .getElementById("sensResult")
    .style.display = "block";

}


/* ================= BACK ================= */

function backToGame(){

    document
    .getElementById("functionPage")
    .style.display = "none";

    document
    .getElementById("gamePage")
    .style.display = "block";

    document
    .getElementById("crosshair")
    .style.display = "none";

}

</script>

</body>
</html>
